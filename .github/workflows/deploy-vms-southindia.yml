---
name: Deploy vNIOS to Azure - South India

on:
  push:
    branches:
      - main
    paths:
      - 'bicep/**'
      - '.github/workflows/deploy-vms-southindia.yml'
      - 'bicep/southindia/parameters/vmdef.json'
      - 'bicep/modules/**'
  pull_request:
    branches:
      - main
    paths:
      - 'bicep/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: TestLabRG
  LOCATION: southindia
  BICEP_FILE: ${{ github.workspace }}/bicep/main.bicep
  PARAM_FILE: ${{ github.workspace }}/bicep/southindia/parameters/vmdef.json

jobs:
  deploy:
    name: Deploy vNIOS to Azure Non-Production - South India
    runs-on: ubuntu-latest

    env:
      RESOURCE_GROUP: TestLabRG
      LOCATION: southindia
      BICEP_FILE: ${{ github.workspace }}/bicep/main.bicep
      PARAM_FILE: ${{ github.workspace }}/bicep/southindia/parameters/vmdef.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy VM - South India
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group "$RESOURCE_GROUP" \
              --template-file "$BICEP_FILE" \
              --parameters "$PARAM_FILE"

      - name: List NIOS - South India
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "Deployed resources are:"
            az vm list \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --show-details \
              --output table
            az network nic list \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --output table
            az network nsg list \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --output table
